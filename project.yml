name: Kiln
options:
  bundleIdPrefix: com.kiln
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    from: 1.2.0
  ModelLabCore:
    path: Packages/ModelLabCore
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    from: 0.31.6
  AxiomCore:
    path: Packages/AxiomCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"

targets:
  Kiln:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Core
      - path: Modules
      - path: UI
      - path: Resources
      - path: ModuleManifests
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kiln.app
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements.plist
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Kiln
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ENABLE_TESTABILITY: YES
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
      - package: ModelLabCore
        product: ModelLabCore
      - package: mlx-swift
        product: MLX
      - package: AxiomCore
        product: AxiomCore

  KilnTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kiln.app.tests
    dependencies:
      - target: Kiln

schemes:
  Kiln:
    build:
      targets:
        Kiln: all
        KilnTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KilnTests
