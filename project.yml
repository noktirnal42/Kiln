name: Kiln
options:
  # Marks the project as already upgraded for this Xcode, so it stops offering
  # "Update to recommended settings". Raise it when you move to a newer Xcode.
  xcodeVersion: "2710"
  bundleIdPrefix: com.kiln
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    from: 1.2.0
  ModelLabCore:
    path: Packages/ModelLabCore
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    from: 0.31.6
  AxiomCore:
    path: Packages/AxiomCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    # Automatic signing with the team's development certificate, as set up in Xcode. An ad-hoc
    # signature changes on every build, which made the Keychain ask for a password at each launch.
    # Archives are signed for development here and re-signed with Developer ID when exported
    # (Organizer > Distribute App > Direct Distribution), which is also what notarization needs.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: LH8KLB9N4F
    # Build settings Xcode recommends for current projects (what "Update to recommended settings" applies).
    CLANG_ANALYZER_NONNULL: YES
    CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION: YES_AGGRESSIVE
    CLANG_ENABLE_OBJC_WEAK: YES
    CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: YES
    CLANG_WARN_BOOL_CONVERSION: YES
    CLANG_WARN_COMMA: YES
    CLANG_WARN_CONSTANT_CONVERSION: YES
    CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: YES
    CLANG_WARN_DIRECT_OBJC_ISA_USAGE: YES_ERROR
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_WARN_EMPTY_BODY: YES
    CLANG_WARN_ENUM_CONVERSION: YES
    CLANG_WARN_INFINITE_RECURSION: YES
    CLANG_WARN_INT_CONVERSION: YES
    CLANG_WARN_NON_LITERAL_NULL_CONVERSION: YES
    CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: YES
    CLANG_WARN_OBJC_LITERAL_CONVERSION: YES
    CLANG_WARN_OBJC_ROOT_CLASS: YES_ERROR
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    CLANG_WARN_RANGE_LOOP_ANALYSIS: YES
    CLANG_WARN_STRICT_PROTOTYPES: YES
    CLANG_WARN_SUSPICIOUS_MOVE: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    CLANG_WARN_UNREACHABLE_CODE: YES
    CLANG_WARN__DUPLICATE_METHOD_MATCH: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    GCC_NO_COMMON_BLOCKS: YES
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    GCC_WARN_UNDECLARED_SELECTOR: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
    GCC_WARN_UNUSED_FUNCTION: YES
    GCC_WARN_UNUSED_VARIABLE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Kiln:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Core
      - path: Modules
      - path: UI
      - path: Resources
        excludes:
          - Ghidra
      - path: Resources/Ghidra
        type: folder
        buildPhase: resources
      - path: ModuleManifests
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kiln.app
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements.plist
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Kiln
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Kiln listens when you dictate or hold a voice conversation with the model.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Kiln turns your speech into text for dictation and voice conversations, on this Mac when possible.
        ENABLE_TESTABILITY: YES
        # Xcode also writes (and XcodeGen presets) an SDK-conditional identity that wins over the
        # unconditional one above. In Release it was "-" (Sign to Run Locally), which produced archives
        # with no team that Organizer refuses to distribute. State it explicitly so nothing overrides it.
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "Apple Development"
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
      - package: ModelLabCore
        product: ModelLabCore
      - package: mlx-swift
        product: MLX
      - package: AxiomCore
        product: AxiomCore

  KilnTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kiln.app.tests
    dependencies:
      - target: Kiln

schemes:
  Kiln:
    build:
      targets:
        Kiln: all
        KilnTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KilnTests
