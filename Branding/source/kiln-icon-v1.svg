<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- macOS-style squircle body: 824pt square on a 1024pt canvas, per Apple's icon grid -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1A14"/>
      <stop offset="1" stop-color="#120C0B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.92" r="0.62">
      <stop offset="0" stop-color="#E8442E" stop-opacity="0.65"/>
      <stop offset="0.55" stop-color="#E8442E" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#E8442E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE3A3"/>
      <stop offset="0.45" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#E8442E"/>
    </linearGradient>
    <linearGradient id="tileFired" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#E8442E"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186" ry="186"/>
    </clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" ry="186" fill="url(#body)"/>
  <rect x="100" y="100" width="824" height="824" fill="url(#glow)" clip-path="url(#squircle)"/>

  <!-- Kiln arch: the chamber -->
  <path d="M334 698 V438 A178 178 0 0 1 690 438 V698" fill="none" stroke="#F4E4D0" stroke-width="36" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Fired flame inside the chamber -->
  <path d="M512 330 C540 390 600 440 600 512 C600 580 560 628 512 628 C464 628 424 580 424 512 C424 462 466 420 512 330 Z" fill="url(#ember)"/>

  <!-- Mosaic tiles: the components, fired together. The centre tile is the one that came out of the kiln. -->
  <rect x="300" y="732" width="134" height="34" rx="8" fill="#F4E4D0"/>
  <rect x="446" y="732" width="134" height="34" rx="8" fill="url(#tileFired)"/>
  <rect x="592" y="732" width="134" height="34" rx="8" fill="#F4E4D0"/>
</svg>
