name: Build and test
# Passed on a hosted macOS runner on 2026-11-04 (build, Mac tests, relay tests, site checks).
# Runs on pull requests and can still be started by hand from the Actions tab.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode on the runner
        run: |
          ls -d /Applications/Xcode*.app | sort -V | tail -1 | xargs -I{} sudo xcode-select -s "{}/Contents/Developer"
          xcodebuild -version
      - run: brew install xcodegen
      - name: Install relay dependencies (the relay end-to-end test starts it)
        run: npm ci --prefix Relay
      - name: Relay tests
        run: npm test --prefix Relay
      - run: xcodegen generate
      - name: Build
        run: xcodebuild -project Kiln.xcodeproj -scheme Kiln -destination 'platform=macOS' -jobs 2 CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation -skipMacroValidation build
      - name: Test (live provider tests are opt-in and stay off)
        run: xcodebuild test -project Kiln.xcodeproj -scheme Kiln -destination 'platform=macOS' -jobs 2 CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation -skipMacroValidation
      - name: Site checks
        run: python3 Scripts/check_site.py
