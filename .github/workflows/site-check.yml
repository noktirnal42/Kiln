name: Check project site
on:
  pull_request:
    paths: ['site/**', 'Scripts/check_site.py', '.github/workflows/site-check.yml']
  push:
    branches: [main]
    paths: ['site/**', 'Scripts/check_site.py', '.github/workflows/site-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python Scripts/check_site.py
