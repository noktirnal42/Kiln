name: Bug report
description: Report a reproducible problem in Kiln.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: "Search existing issues first. For sensitive vulnerabilities, follow SECURITY.md instead of posting details here. Do not include keys, private prompts, private source, or personal data."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the user-visible problem and its impact.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a minimal synthetic example, relevant settings, and numbered steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kiln commit or build
      placeholder: Commit SHA or release/build identifier
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS version, Xcode version, chip, memory
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider and model, if relevant
      description: Include the endpoint type and observed status, but never a key or token.
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or screenshots
      description: Include only the smallest useful evidence. State whether the test used a real provider, mock, GUI, or CLI.
  - type: checkboxes
    id: privacy
    attributes:
      label: Report check
      options:
        - label: I removed credentials and private data from this report.
          required: true
